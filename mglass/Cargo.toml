[package]
name = "mglass"
version = "0.1.0"
edition = "2021"
description = "Phemio transparency helper: runs inside Explorer to make the taskbar and File Explorer backgrounds see-through"
license = "MIT OR Apache-2.0"

[workspace]

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies.windows]
version = "0.62.2"
features = [
  "std",
  "Foundation",
  "Foundation_Collections",
  "Foundation_Numerics",
  "UI",
  "UI_Composition",
  "UI_Core",
  "Graphics_Effects",
  "Win32_Graphics_Direct2D",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Graphics_Direct2D",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_ProcessStatus",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_Controls",
  "Win32_UI_WindowsAndMessaging",
]

[dependencies]
windows-core = "0.62"
windows-collections = "0.3"
windows-numerics = "0.3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "unwind"
strip = true
