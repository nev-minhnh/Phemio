name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  TARGET: x86_64-pc-windows-gnu

jobs:
  build:
    name: Build Phemio.exe
    # Cross-compiling from Linux with MinGW is the quickest way to a Windows exe.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: MinGW-w64
        run: sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64 zip

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            mglass -> target

      - name: Build the transparency helper (mglass.dll)
        working-directory: mglass
        run: cargo build --release --locked --target $TARGET

      - name: Build Phemio
        run: cargo build --release --locked --target $TARGET

      - name: Package
        id: pkg
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p dist/app
          cp target/$TARGET/release/phemio.exe dist/app/Phemio.exe
          cp README.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE NOTICE dist/app/
          (cd dist/app && zip -9 -q ../Phemio-$VERSION.zip Phemio.exe README.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE NOTICE)
          git archive --format=zip --prefix=phemio/ -o dist/Phemio-$VERSION-source.zip HEAD
          ls -la dist
          # The version is in the exe twice (file and product version).
          test "$(strings -el dist/app/Phemio.exe | grep -c "^$VERSION\$")" -ge 2

      - name: Upload the app
        uses: actions/upload-artifact@v4
        with:
          name: Phemio-${{ steps.pkg.outputs.version }}
          path: dist/Phemio-${{ steps.pkg.outputs.version }}.zip
          compression-level: 0

      - name: Upload the source
        uses: actions/upload-artifact@v4
        with:
          name: Phemio-${{ steps.pkg.outputs.version }}-source
          path: dist/Phemio-${{ steps.pkg.outputs.version }}-source.zip
          compression-level: 0

      - name: Zips into the log (base64, for tools that can read logs but not artifacts)
        if: github.event_name != 'pull_request'
        run: |
          for f in dist/Phemio-*.zip; do
            echo "=====FILE-BEGIN $(basename "$f") $(sha256sum "$f" | cut -d' ' -f1)====="
            base64 -w 3000 "$f" | sed 's/^/F:/'
            echo "=====FILE-END====="
          done

      - name: Upload the exe (for the preview job)
        uses: actions/upload-artifact@v4
        with:
          name: phemio-exe
          path: dist/app/Phemio.exe
          retention-days: 3

  preview:
    name: Preview on Windows
    # Runs the exe on a real Windows (with its fonts) and saves what the island
    # and Settings drew, frame by frame, as PNG — a quick look at every page.
    needs: build
    runs-on: windows-2025
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@v4
        with:
          name: phemio-exe
          path: app
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Run and capture
        shell: pwsh
        run: ./.github/scripts/preview.ps1 -Exe app/Phemio.exe -Out previews
      - name: Fonts on this runner
        shell: pwsh
        run: Get-ChildItem C:\Windows\Fonts -Filter "Seg*" | Select-Object -ExpandProperty Name
      - name: Previews into the log (base64 zip, for tools that can read logs but not artifacts)
        shell: pwsh
        run: |
          Compress-Archive -Path previews/* -DestinationPath previews.zip -Force
          $b = [Convert]::ToBase64String([IO.File]::ReadAllBytes("previews.zip"))
          Write-Output "=====PREVIEWS-BEGIN====="
          for ($i = 0; $i -lt $b.Length; $i += 3000) { Write-Output ("P:" + $b.Substring($i, [Math]::Min(3000, $b.Length - $i))) }
          Write-Output "=====PREVIEWS-END====="
      - uses: actions/upload-artifact@v4
        with:
          name: previews
          path: previews
          retention-days: 14

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Phemio-*
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
